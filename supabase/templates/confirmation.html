<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 420px; margin: 0 auto; padding: 24px; color: #18181b;">
  <h2 style="margin: 0 0 12px; font-size: 20px;">Your Tracker sign-in code</h2>
  <p style="margin: 0 0 16px; font-size: 14px; color: #52525b;">Type this code on the sign-in screen. It expires in 1 hour.</p>
  <p style="margin: 0 0 24px; font-size: 32px; font-weight: 700; letter-spacing: 6px;">{{ .Token }}</p>
  <p style="margin: 0 0 8px; font-size: 14px; color: #52525b;">Or open this link on the same device and browser:</p>
  <p style="margin: 0 0 24px; font-size: 14px;"><a href="{{ .ConfirmationURL }}" style="color: #15803d;">Sign in to Tracker</a></p>
  <p style="margin: 0; font-size: 12px; color: #71717a;">If you didn't ask for this, you can ignore this email.</p>
</div>
