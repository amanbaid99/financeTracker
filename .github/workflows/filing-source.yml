name: Public filing source sample

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/radar/filing-probe.mjs"
      - "scripts/radar/source-samples.json"
      - ".github/workflows/filing-source.yml"

permissions:
  contents: read

jobs:
  source-sample:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Fetch bounded public filing sample
        run: node scripts/radar/filing-probe.mjs artifacts/filings
      - name: Save public sample and source diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-filing-source-sample
          path: artifacts/filings/
          retention-days: 1
          if-no-files-found: error
