<!doctype html>
<html lang="en-IN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Offline · Tracker</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #faf9f6; color: #1c1917; padding: 16px;
      }
      @media (prefers-color-scheme: dark) { body { background: #111; color: #eee; } p { color: #aaa; } }
      main { max-width: 22rem; text-align: center; }
      img { width: 56px; height: 56px; border-radius: 14px; }
      h1 { font-size: 20px; margin: 16px 0 8px; }
      p { color: #57534e; font-size: 14px; margin: 0 0 20px; }
      button {
        min-height: 44px; padding: 0 20px; border: 0; border-radius: 12px;
        background: #15803d; color: #fff; font: inherit; font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="" />
      <h1>You're offline</h1>
      <p>Tracker needs a connection to show your latest numbers. Your data is safe.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
